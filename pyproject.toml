[project]
name = "website"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.8.2",
    "pelican>=4.11.0",
    "pelican-sitemap>=1.1.0",
    "typogrify>=2.1.0",
]

# Supply-chain guard: ignore any package version published in the last 16 days.
# Mitigates malicious releases that get yanked within a couple weeks. Applies
# at resolution time (`uv lock`, `uv add`, `uv lock --upgrade`); `uv sync`
# installs from the existing lockfile and is unaffected.
[tool.uv]
exclude-newer = "16 days"

[tool.taskipy.tasks]
build = "pelican content -o output -s publishconf.py"
serve = "pelican --listen --autoreload"
clean = "rm -r output"

[dependency-groups]
dev = [
    "taskipy>=1.14.1",
]
