<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/style.css">
  <link rel="icon" href="{{ SITEURL }}/theme/logo/icon-trail.svg" type="image/svg+xml">
</head>
<body>
  <main>
    <a href="{{ SITEURL }}/" class="logo"><img src="{{ SITEURL }}/theme/logo/wordmark.svg" alt="{{ SITENAME }}"></a>
    {% block content %}{% endblock %}
  </main>
  <footer>
	<p>&copy; {{ SITEYEAR }} {{ SITENAME }} — <a href="/about/">about</a> — <a href="mailto:hello@ramblin.dev">hello@ramblin.dev</a></p>
  </footer>
</body>
</html>
